<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Personal page of Alejandro, a web developer focused on user accessibility and modern design."
    />
    <title>Alejandro | Web Developer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <section class="intro">
        <p class="intro__hello">
          Hello!
          <span aria-hidden="true">👋</span>
        </p>

        <h1 class="intro__tagline">
          I'm <span class="name">Alejandro</span>, a vibe coder and web
          developer focused on user accessibility and modern design.
          <span aria-hidden="true">💻</span>
        </h1>

        <p class="intro__contact">
          Let's connect on
          <a
            class="btn"
            href="https://www.linkedin.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            LinkedIn
            <span class="btn__arrow" aria-hidden="true"
              ><i class="bi bi-arrow-right"></i
            ></span>
          </a>
        </p>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__copyright">
        Made with <span aria-hidden="true">☕</span> by
        <a
          href="https://github.com/"
          target="_blank"
          rel="noopener noreferrer"
          >Alejandro</a
        ><br />
        Inspired by
        <a
          href="https://bchiang7.github.io/"
          target="_blank"
          rel="noopener noreferrer"
          >Brittany Chiang</a
        >
      </p>

      <nav aria-label="Social media">
        <ul class="footer__links">
          <li>
            <a
              href="https://www.instagram.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="bi bi-instagram" aria-hidden="true"></i>
              <span>Instagram</span>
            </a>
          </li>
          <li>
            <a
              href="https://www.linkedin.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="bi bi-linkedin" aria-hidden="true"></i>
              <span>LinkedIn</span>
            </a>
          </li>
          <li>
            <a
              href="https://t.me/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="bi bi-telegram" aria-hidden="true"></i>
              <span>Telegram</span>
            </a>
          </li>
        </ul>
      </nav>
    </footer>

  </body>
</html>
